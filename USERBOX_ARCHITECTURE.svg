<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>userBox system architecture</title>
  <desc>Personalized RAG tutoring architecture showing React dashboard, FastAPI, LangGraph ReAct agent, Qdrant dual retrieval, PostgreSQL source of truth, and the deterministic learner core.</desc>
  <style>
    .bg { fill: #ffffff; }
    .h { font-size: 16.5px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 12.5px; fill: #475569; }
    .m { font-size: 11.5px; fill: #64748b; }
    .item { fill: #ffffff; stroke-width: 1.3; }
    .core { fill: #fff7e0; stroke: #d97706; stroke-width: 2.4; }
    .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .badge { fill: #0f172a; }
    .bt { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .chip { stroke-width: 1.3; fill: #ffffff; stroke: #7c5cc4; }
    .chipcore { fill: #fff7e0; stroke: #d97706; stroke-width: 2.2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1020"/>

  <!-- Title Banner -->
  <text x="40" y="48" font-size="28" font-weight="800" fill="#0f172a">userBox: system architecture</text>
  <text x="40" y="75" font-size="14.5" fill="#475569">A student message goes in, an adaptive pedagogical turn comes out. The agent stays grounded via dual retrieval, and deterministic math is the source of truth.</text>
  <rect x="1205" y="34" width="22" height="16" rx="4" fill="#fff7e0" stroke="#d97706" stroke-width="2.4"/>
  <text x="1235" y="47" font-size="13.5" fill="#475569">= the reliability core (explain this first)</text>

  <!-- ============ CLIENT / FRONTEND ============ -->
  <rect x="40" y="105" width="265" height="430" rx="12" fill="#fff7ea" stroke="#d08a00" stroke-width="1.8"/>
  <text class="h" x="56" y="131">Dashboard · frontend/</text>
  <text class="s" x="56" y="149">React 18 · TypeScript · Vite · Tailwind</text>

  <rect class="item" x="54" y="165" width="237" height="85" rx="8" stroke="#d08a00"/>
  <text class="t" x="66" y="185">ProgressPanel.tsx</text>
  <text class="s" x="66" y="204">Concept status badges &amp; mastery bars</text>
  <text class="s" x="66" y="222">EMA mastery tracking [0.0 – 1.0]</text>
  <text class="s" x="66" y="240">Due reviews &amp; next suggested topic</text>

  <rect class="item" x="54" y="260" width="237" height="98" rx="8" stroke="#d08a00"/>
  <text class="t" x="66" y="280">ChatPanel.tsx</text>
  <text class="s" x="66" y="300">Multi-turn teach/quiz dialogue</text>
  <text class="s" x="66" y="318">Interactive quiz answer submission</text>
  <text class="s" x="66" y="336">Collapsible tool trace drawer</text>
  <text class="m" x="66" y="352">(search_kb, recall_persona, etc.)</text>

  <rect class="item" x="54" y="368" width="237" height="74" rx="8" stroke="#d08a00"/>
  <text class="t" x="66" y="388">Controls &amp; Ingestion UI</text>
  <text class="s" x="66" y="408">User persona switcher (alice / bob)</text>
  <text class="s" x="66" y="426">Curriculum markdown upload form</text>

  <rect class="item" x="54" y="452" width="237" height="68" rx="8" stroke="#d08a00"/>
  <text class="t" x="66" y="472">API Transport · api.ts</text>
  <text class="s" x="66" y="492">Fetch / JSON turn requests</text>
  <text class="s" x="66" y="508">Receives answer + tool trace + diffs</text>

  <!-- ============ FASTAPI BACKEND ============ -->
  <rect x="335" y="105" width="315" height="430" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.8"/>
  <text class="h" x="351" y="131">API · FastAPI · backend/</text>
  <text class="s" x="351" y="149">Async lifespan · CORS · Pydantic validation</text>

  <rect class="item" x="350" y="165" width="285" height="85" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="364" y="185">Async Lifespan (main.py)</text>
  <text class="s" x="364" y="204">init_db() creates Postgres tables</text>
  <text class="s" x="364" y="222">ensure_collection() sets up Qdrant</text>
  <text class="m" x="364" y="240">Imports &amp; tests run with NO API key</text>

  <rect class="item" x="350" y="260" width="285" height="98" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="364" y="280">Router Endpoints (api/routes/)</text>
  <text class="s" x="364" y="300">POST /chat · executes tutor.take_turn</text>
  <text class="s" x="364" y="318">GET /progress/{user_id} · syllabus state</text>
  <text class="s" x="364" y="336">POST /ingest · chunking &amp; indexing</text>
  <text class="s" x="364" y="352">GET /health · zero-dependency probe</text>

  <rect class="core" x="350" y="368" width="285" height="74" rx="8"/>
  <text class="t" x="364" y="388">RunnableConfig Injection</text>
  <text class="s" x="364" y="408">user_id injected into runtime context</text>
  <text class="s" x="364" y="426">Hidden from LLM: prevents spoofing</text>

  <rect class="item" x="350" y="452" width="285" height="68" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="364" y="472">Trace &amp; Mastery Formatter</text>
  <text class="s" x="364" y="492">Walks AIMessage.tool_calls &amp; results</text>
  <text class="s" x="364" y="508">Extracts mastery delta &amp; suggestions</text>

  <!-- ============ AGENT & VECTOR STORE ============ -->
  <rect x="680" y="105" width="455" height="430" rx="12" fill="#ecf8f0" stroke="#2e8b57" stroke-width="1.8"/>
  <text class="h" x="696" y="131">Agent &amp; Dual Retrieval · tutor.py</text>
  <text class="s" x="696" y="149">LangGraph ReAct loop + Qdrant isolated collections</text>

  <rect class="item" x="695" y="165" width="425" height="110" rx="8" stroke="#2e8b57"/>
  <text class="t" x="709" y="185">LangGraph ReAct Agent (tutor.py)</text>
  <text class="s" x="709" y="204">create_react_agent (Gemini-flash-lite / GPT-4o-mini)</text>
  <text class="s" x="709" y="222">Dynamic system prompt + last 10 messages chat history</text>
  <text class="s" x="709" y="240">Reasoning loop capped at MAX_AGENT_STEPS = 10</text>
  <text class="s" x="709" y="258">7 tools: search_kb, recall_persona, save_memory, pose_question,</text>
  <text class="m" x="709" y="272">grade_and_update, get_learner_model, select_next_concept</text>

  <rect class="item" x="695" y="285" width="425" height="74" rx="8" stroke="#2e8b57"/>
  <text class="t" x="709" y="305">Qdrant · subjects_kb Collection</text>
  <text class="s" x="709" y="324">Shared curriculum ("what to teach") · 3072-dim vectors</text>
  <text class="s" x="709" y="342">Chunked biology docs · filter by metadata.concept_id</text>

  <rect class="item" x="695" y="368" width="425" height="74" rx="8" stroke="#2e8b57"/>
  <text class="t" x="709" y="388">Qdrant · user_box Collection</text>
  <text class="s" x="709" y="408">Per-learner memory ("how to teach") · filter by metadata.user_id</text>
  <text class="s" x="709" y="426">Stores quirks, pacing, past misconceptions (auto-consolidated &gt; 10)</text>

  <rect class="item" x="695" y="452" width="425" height="68" rx="8" stroke="#2e8b57"/>
  <text class="t" x="709" y="472">Curriculum DAG Navigation (select_next_concept)</text>
  <text class="s" x="709" y="492">Priority: Due reviews → Lowest mastery in-progress → Next seq</text>
  <text class="s" x="709" y="508">Soft lock: prereqs checked on not-started; never locks started</text>

  <!-- ============ COGNITIVE CORE (RELIABILITY CORE) ============ -->
  <rect class="core" x="1165" y="105" width="395" height="430" rx="12"/>
  <text class="h" x="1181" y="131">Cognitive Core · learner.py</text>
  <text class="s" x="1181" y="149">Deterministic Python only — zero LLM hallucination of state</text>

  <rect class="item" x="1180" y="165" width="365" height="85" rx="8" stroke="#d97706"/>
  <text class="t" x="1194" y="185">Structured Output Grading Gate</text>
  <text class="s" x="1194" y="204">grade_answer() uses ChatModel.with_structured_output</text>
  <text class="s" x="1194" y="222">Pydantic Grade schema: quality (0.0–1.0), explanation,</text>
  <text class="s" x="1194" y="240">and optional misconception. The ONLY LLM grading call.</text>

  <rect class="item" x="1180" y="260" width="365" height="85" rx="8" stroke="#d97706"/>
  <text class="t" x="1194" y="280">Deterministic EMA Mastery Tracking</text>
  <text class="s" x="1194" y="300">ema(old, quality, alpha=0.4) = (1 - alpha)*old + alpha*quality</text>
  <text class="s" x="1194" y="318">Clamped strictly to [0.0, 1.0]; status flips to 'mastered' at ≥ 0.7</text>
  <text class="s" x="1194" y="336">Gradual upward convergence; smooth decay on student struggle</text>

  <rect class="item" x="1180" y="355" width="365" height="86" rx="8" stroke="#d97706"/>
  <text class="t" x="1194" y="375">SM-2-lite Spaced Repetition Scheduling</text>
  <text class="s" x="1194" y="395">Pass (quality ≥ 0.6): streak += 1, interval = 1 * 2^(streak - 1) days</text>
  <text class="s" x="1194" y="413">Doubling intervals: 1d → 2d → 4d → 8d... for durable memory</text>
  <text class="s" x="1194" y="431">Fail (quality &lt; 0.6): streak = 0, re-test scheduled in ~1 hr (0.05 d)</text>

  <rect class="item" x="1180" y="450" width="365" height="70" rx="8" stroke="#d97706"/>
  <text class="t" x="1194" y="470">Offline pytest Verification Suite (tests/)</text>
  <text class="s" x="1194" y="490">10 unit tests: test_mastery.py &amp; test_db.py</text>
  <text class="s" x="1194" y="508">Tests math boundaries, schema tables, composite PKs offline</text>

  <!-- ============ POSTGRESQL SOURCE OF TRUTH ============ -->
  <rect x="40" y="560" width="1030" height="230" rx="12" fill="#f3effb" stroke="#7c5cc4" stroke-width="1.8"/>
  <text class="h" x="56" y="586">PostgreSQL 16 · SQLAlchemy 2.0 · Source of Truth</text>
  <text class="s" x="56" y="606">All authoritative learner progress, streaks, and session states live in relational tables, not vector stores.</text>

  <!-- Table Chips -->
  <rect class="chip" x="56" y="622" width="115" height="34" rx="8"/><text class="t" x="113" y="644" text-anchor="middle">concepts</text>
  <rect class="chipcore" x="181" y="622" width="410" height="34" rx="8"/><text class="t" x="386" y="644" text-anchor="middle">learner_concept (Composite PK: user_id, concept_id)</text>
  <rect class="chipcore" x="601" y="622" width="265" height="34" rx="8"/><text class="t" x="733" y="644" text-anchor="middle">sessions (PK: user_id)</text>
  <rect class="chip" x="876" y="622" width="175" height="34" rx="8"/><text class="t" x="963" y="644" text-anchor="middle">Base.metadata (no alembic)</text>

  <rect class="chip" x="56" y="668" width="345" height="34" rx="8"/><text class="s" x="228" y="690" text-anchor="middle">id (PK) · subject · title · summary · prereqs (JSONB) · seq (int)</text>
  <rect class="chip" x="411" y="668" width="365" height="34" rx="8"/><text class="s" x="593" y="690" text-anchor="middle">mastery (float) · status · streak · misconceptions (JSONB) · next_review (tz)</text>
  <rect class="chip" x="786" y="668" width="265" height="34" rx="8"/><text class="s" x="918" y="690" text-anchor="middle">current_concept_id · pending_question · chat_history</text>

  <text class="s" x="56" y="730">Atomic session updates: Answering a pending question clears pending_question atomically in the same transaction as apply_grade.</text>
  <text class="s" x="56" y="750">Idempotency &amp; Replay Prevention: Student cannot re-grade the same question twice; state is locked to the database row.</text>
  <text class="s" x="56" y="770">Curriculum Synthesis: LEFT JOIN concepts ↔ learner_concept dynamically populates syllabus with defaults for unstarted topics.</text>

  <!-- ============ EXTERNAL SERVICES ============ -->
  <rect x="1100" y="560" width="460" height="230" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.8"/>
  <text class="h" x="1116" y="586">External Services &amp; Ingestion</text>

  <rect class="item" x="1116" y="605" width="205" height="74" rx="8" stroke="#71717a"/>
  <text class="t" x="1128" y="626">Google Gemini / OpenAI</text>
  <text class="m" x="1128" y="645">Chat: gemini-flash-lite / gpt-4o-mini</text>
  <text class="m" x="1128" y="663">Embed: gemini-embedding-001 (3072d)</text>

  <rect class="item" x="1331" y="605" width="214" height="74" rx="8" stroke="#71717a"/>
  <text class="t" x="1343" y="626">Seed Docs (seed_docs/)</text>
  <text class="m" x="1343" y="645">chromosomes.md (seq 0, no prereq)</text>
  <text class="m" x="1343" y="663">mitosis.md (seq 1) · meiosis.md (seq 2)</text>

  <rect class="item" x="1116" y="688" width="429" height="90" rx="8" stroke="#71717a"/>
  <text class="t" x="1128" y="708">ingest.py · RecursiveCharacterTextSplitter</text>
  <text class="s" x="1128" y="728">Splits curriculum into 1000-char chunks with 150-char overlap</text>
  <text class="s" x="1128" y="746">Upserts concept rows into PostgreSQL; pushes chunk vectors to Qdrant</text>
  <text class="m" x="1128" y="764">Runnable via CLI (python ingest.py) or via POST /ingest endpoint</text>

  <!-- ============ CONNECTING ARROWS & BADGES ============ -->
  <!-- 1: Dashboard -> API (Chat Request) -->
  <path class="line" d="M305 300 H335"/>
  <circle class="badge" cx="320" cy="300" r="12"/><text class="bt" x="320" y="305">1</text>

  <!-- 2: API -> Postgres (Load Session & State) -->
  <path class="line" d="M420 535 V560"/>
  <circle class="badge" cx="420" cy="548" r="12"/><text class="bt" x="420" y="553">2</text>

  <!-- 3: API -> Agent (Invoke take_turn with RunnableConfig) -->
  <path class="line" d="M650 200 H680"/>
  <circle class="badge" cx="665" cy="200" r="12"/><text class="bt" x="665" y="205">3</text>

  <!-- 4: Agent -> Qdrant Dual Retrieval -->
  <path class="line" d="M900 275 V285"/>
  <path class="line" d="M900 359 V368"/>
  <circle class="badge" cx="900" cy="360" r="12"/><text class="bt" x="900" y="365">4</text>

  <!-- 5: Agent -> Cognitive Core (Structured Grade Answer) -->
  <path class="line" d="M1135 210 H1165"/>
  <circle class="badge" cx="1150" cy="210" r="12"/><text class="bt" x="1150" y="215">5</text>

  <!-- 6: Grade Answer -> Deterministic Math (apply_grade) -->
  <path class="line" d="M1360 250 V260"/>
  <circle class="badge" cx="1360" cy="255" r="12"/><text class="bt" x="1360" y="260">6</text>

  <!-- 7: Cognitive Core -> Postgres (Atomic Persist) -->
  <path class="line" d="M1250 535 V548 H850 V560"/>
  <circle class="badge" cx="1050" cy="548" r="12"/><text class="bt" x="1050" y="553">7</text>

  <!-- 8: API -> Dashboard (Return Answer + Mastery Diff + Tool Traces) -->
  <path class="line" d="M335 480 H305"/>
  <circle class="badge" cx="320" cy="480" r="12"/><text class="bt" x="320" y="485">8</text>

  <!-- External LLM calls -->
  <path class="dash" d="M1135 180 H1180"/>
  <path class="dash" d="M1116 630 H1070"/>

  <!-- ============ 8-STEP LIFECYCLE FLOW ============ -->
  <line x1="40" y1="810" x2="1560" y2="810" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="h" x="40" y="836">One teaching turn in 8 steps</text>

  <!-- Row 1: Steps 1-4 -->
  <circle class="badge" cx="53" cy="868" r="13"/><text class="bt" x="53" y="873">1</text>
  <text class="s" x="76" y="864">Message arrives: POST /chat {user_id, message}</text>
  <text class="s" x="76" y="882">sent from React dashboard with current session context</text>

  <circle class="badge" cx="433" cy="868" r="13"/><text class="bt" x="433" y="873">2</text>
  <text class="s" x="456" y="864">API loads session: fetches current_concept_id,</text>
  <text class="s" x="456" y="882">chat history, and checks for an open pending_question</text>

  <circle class="badge" cx="813" cy="868" r="13"/><text class="bt" x="813" y="873">3</text>
  <text class="s" x="836" y="864">Identity injection: user_id is injected via RunnableConfig;</text>
  <text class="s" x="836" y="882">system prompt is assembled with pedagogical objectives</text>

  <circle class="badge" cx="1193" cy="868" r="13"/><text class="bt" x="1193" y="873">4</text>
  <text class="s" x="1216" y="864">Dual retrieval: LangGraph searches subjects_kb for facts</text>
  <text class="s" x="1216" y="882">and user_box for student learning quirks &amp; past mistakes</text>

  <!-- Row 2: Steps 5-8 -->
  <circle class="badge" cx="53" cy="926" r="13"/><text class="bt" x="53" y="931">5</text>
  <text class="s" x="76" y="922">Structured grading: if answering a pending question,</text>
  <text class="s" x="76" y="940">LLM outputs Pydantic Grade (quality, explanation, error)</text>

  <circle class="badge" cx="433" cy="926" r="13"/><text class="bt" x="433" y="931">6</text>
  <text class="s" x="456" y="922">Deterministic math (learner.py): EMA calculates</text>
  <text class="s" x="456" y="940">mastery delta; SM-2-lite schedules next review interval</text>

  <circle class="badge" cx="813" cy="926" r="13"/><text class="bt" x="813" y="931">7</text>
  <text class="s" x="836" y="922">Atomic commit: upserts learner_concept in Postgres,</text>
  <text class="s" x="836" y="940">clears pending_question, and saves episodic memories</text>

  <circle class="badge" cx="1193" cy="926" r="13"/><text class="bt" x="1193" y="931">8</text>
  <text class="s" x="1216" y="922">Stream response &amp; traces: returns answer, mastery</text>
  <text class="s" x="1216" y="940">change diffs, and tool execution traces to the dashboard</text>

  <!-- Footer note -->
  <text class="m" x="40" y="990">*user_id is injected via RunnableConfig so the model cannot spoof identity. All scoring (EMA) and spaced repetition (SM-2-lite) run deterministically in Python, verified by 10 pytest tests.</text>
</svg>
