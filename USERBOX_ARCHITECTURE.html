<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>userBox: System Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      width: 100%;
      max-width: 1600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }
    .title-group p {
      font-size: 13px;
      color: #94a3b8;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #334155;
      border-color: #64748b;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .diagram-container {
      width: 100%;
      max-width: 1600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 1px solid #334155;
    }
    .diagram-container svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>userBox: System Architecture Diagram</h1>
      <p>High-resolution system design diagram for interview presentations &amp; technical deep dives</p>
    </div>
    <div class="actions">
      <a href="USERBOX_ARCHITECTURE.svg" download="USERBOX_ARCHITECTURE.svg" class="btn btn-primary">Download SVG</a>
      <button onclick="window.print()" class="btn">Print / Save as PDF</button>
    </div>
  </div>

  <div class="diagram-container">
    <img src="USERBOX_ARCHITECTURE.svg" alt="userBox System Architecture" style="width:100%; height:auto;" />
  </div>
</body>
</html>
