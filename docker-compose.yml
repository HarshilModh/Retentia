version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: userbox-postgres
    environment:
      POSTGRES_USER: userbox
      POSTGRES_PASSWORD: userbox
      POSTGRES_DB: userbox
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: userbox-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  postgres_data:
  qdrant_data:
